[project]
name = "revision-ripple"
version = "0.1.0"
description = "An agent that diffs film script drafts and tells each production department what changed for them."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }

dependencies = [
    # Agent framework
    "strands-agents>=1.54.0",
    "strands-agents-tools>=0.2.0",
    # AWS
    "boto3>=1.40.0",
    "botocore>=1.40.0",
    # Parsing
    "lxml>=6.0.0",
    "pdfplumber>=0.11.4",
    # Model / validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Config + CLI
    "python-dotenv>=1.0.1",
    "typer>=0.15.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.3",
]
fallback = [
    "groq>=0.13.0",
    "google-genai>=0.3.0",
]
db = [
    "supabase>=2.10.0",
    "psycopg[binary]>=3.2.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "lxml-stubs>=0.5.1",
    "boto3-stubs[bedrock,bedrock-runtime,s3,sts]>=1.35.0",
]

[project.scripts]
ripple = "ripple.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ripple"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length: handled by the formatter
    "UP042",  # str+Enum is deliberate: values must serialise as strings for
              # JSON, SSE and Postgres. StrEnum would change repr in 3.12.
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# `-m "not live"` is what actually deselects the paid tests. Without it the
# live suite runs on every plain `pytest` the moment credentials exist.
addopts = "-q --strict-markers -m 'not live'"
markers = [
    "live: hits a real model provider; costs money. Deselected by default.",
]

[tool.mypy]
python_version = "3.12"
packages = ["ripple"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true

# Optional fallback providers: installed only with the `fallback` extra, and
# imported lazily inside the functions that use them. Absent stubs here are
# expected, not a type error.
[[tool.mypy.overrides]]
module = ["groq.*", "google.*", "google.genai.*"]
ignore_missing_imports = true
