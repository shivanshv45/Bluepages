<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" width="1060" height="560" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8aa0"/>
    </marker>
  </defs>
  <rect width="1060" height="560" fill="#ffffff"/>

  <text x="40" y="44" font-size="20" font-weight="700" fill="#0f172a">Why the mechanical diff is not the product</text>
  <text x="40" y="68" font-size="13.5" fill="#64748b">Text differencing sees strings move. Departments need to know what the move costs. Four real cases:</text>

  <!-- header row -->
  <text x="52" y="112" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.2">WHAT THE DIFF SEES</text>
  <text x="400" y="112" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.2">THE JUDGMENT</text>
  <text x="800" y="112" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.2">WHO PAYS</text>

  <!-- row 1 -->
  <rect x="40" y="124" width="980" height="92" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="150" font-size="12.5" font-weight="600" fill="#0f172a">"brass letter opener"</text>
  <text x="56" y="170" font-size="12" fill="#64748b">gone from sc. 3,</text>
  <text x="56" y="189" font-size="12" fill="#64748b">present in sc. 7</text>
  <line x1="350" y1="170" x2="378" y2="170" stroke="#7d8aa0" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="396" y="156" font-size="12.5" fill="#334155">Same object relocated, or a cut</text>
  <text x="396" y="176" font-size="12.5" fill="#334155">and a separate new buy?</text>
  <text x="396" y="199" font-size="11.5" fill="#94a3b8" font-style="italic">The diff emits a candidate. The model decides.</text>
  <line x1="770" y1="170" x2="798" y2="170" stroke="#7d8aa0" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="816" y="163" font-size="12.5" font-weight="600" fill="#0f172a">Props</text>
  <text x="816" y="184" font-size="11.5" fill="#64748b">continuity note, or a</text>
  <text x="816" y="202" font-size="11.5" fill="#64748b">purchase order</text>

  <!-- row 2 -->
  <rect x="40" y="226" width="980" height="92" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="252" font-size="12.5" font-weight="600" fill="#0f172a">JANITOR → CUSTODIAN</text>
  <text x="56" y="272" font-size="12" fill="#64748b">one character cue</text>
  <text x="56" y="291" font-size="12" fill="#64748b">renamed throughout</text>
  <line x1="350" y1="272" x2="378" y2="272" stroke="#7d8aa0" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="396" y="258" font-size="12.5" fill="#334155">A renamed role, or a genuinely</text>
  <text x="396" y="278" font-size="12.5" fill="#334155">new one to cast?</text>
  <text x="396" y="301" font-size="11.5" fill="#94a3b8" font-style="italic">Read the scenes, not the string.</text>
  <line x1="770" y1="272" x2="798" y2="272" stroke="#7d8aa0" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="816" y="265" font-size="12.5" font-weight="600" fill="#0f172a">Casting</text>
  <text x="816" y="286" font-size="11.5" fill="#64748b">a day player is worth</text>
  <text x="816" y="304" font-size="11.5" fill="#64748b">thousands of dollars</text>

  <!-- row 3 -->
  <rect x="40" y="328" width="980" height="92" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="354" font-size="12.5" font-weight="600" fill="#0f172a">"hands her the envelope"</text>
  <text x="56" y="374" font-size="12" fill="#64748b">→ "slides it across</text>
  <text x="56" y="393" font-size="12" fill="#64748b">the table"</text>
  <line x1="350" y1="374" x2="378" y2="374" stroke="#7d8aa0" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="396" y="360" font-size="12.5" fill="#334155">Same prop, same cast, but that</text>
  <text x="396" y="380" font-size="12.5" fill="#334155">is a different camera setup.</text>
  <text x="396" y="403" font-size="11.5" fill="#94a3b8" font-style="italic">A physical consequence with no element change.</text>
  <line x1="770" y1="374" x2="798" y2="374" stroke="#7d8aa0" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="816" y="367" font-size="12.5" font-weight="600" fill="#0f172a">AD, camera</text>
  <text x="816" y="388" font-size="11.5" fill="#64748b">Props unaffected and</text>
  <text x="816" y="406" font-size="11.5" fill="#64748b">should not be told</text>

  <!-- row 4 -->
  <rect x="40" y="430" width="980" height="92" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="456" font-size="12.5" font-weight="600" fill="#0f172a">INT. DINER - DAY</text>
  <text x="56" y="476" font-size="12" fill="#64748b">→ INT. DINER - NIGHT</text>
  <text x="56" y="495" font-size="12" fill="#64748b">four words in a heading</text>
  <line x1="350" y1="476" x2="378" y2="476" stroke="#7d8aa0" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="396" y="462" font-size="12.5" fill="#334155">Not a prop change at all. A</text>
  <text x="396" y="482" font-size="12.5" fill="#334155">scheduling change.</text>
  <text x="396" y="505" font-size="11.5" fill="#94a3b8" font-style="italic">The smallest edit on the page, the largest consequence.</text>
  <line x1="770" y1="476" x2="798" y2="476" stroke="#7d8aa0" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="816" y="469" font-size="12.5" font-weight="600" fill="#0f172a">Schedule, locations</text>
  <text x="816" y="490" font-size="11.5" fill="#64748b">a board move and</text>
  <text x="816" y="508" font-size="11.5" fill="#64748b">possibly a re-quote</text>
</svg>
