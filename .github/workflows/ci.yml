name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the deploy target (AgentCore, Lambda); 3.13 guards against
        # breakage before we move.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Type check
        run: mypy

      - name: Test
        # No AWS credentials in CI: `live` tests are deselected, so nothing here
        # can spend money.
        run: pytest -q -m "not live" --cov=bluepages --cov-report=term-missing
